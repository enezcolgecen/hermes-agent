name: Contributor Attribution Check

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON array of review status objects"
        value: ${{ jobs.check-attribution.outputs.review_status }}

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      review_status: ${{ steps.check-emails.outputs.review_status }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git log

      - name: Check for unmapped contributor emails
        id: check-emails
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          # Base is data, not shell code. Use the same fail-closed audit as local tooling.
          BASE_REF="${PR_BASE_REF:-main}"
          python3 scripts/audit_pr_attribution.py \
            --base "refs/remotes/origin/${BASE_REF}" \
            --review-status review-status.json

      - name: Upload review status artifact
        if: always() && steps.check-emails.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-status-contributor-check
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
